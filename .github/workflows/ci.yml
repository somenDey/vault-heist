name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: this workflow never needs to write to the repo.
permissions:
  contents: read

# A new push to the same branch cancels the run already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # setup-uv publishes exact versions only
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install dependencies (fails if uv.lock is out of date)
        run: just install

      - name: Lint, type-check and test
        run: just check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # lets gitleaks comment on a PR if it finds a leak
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so every commit is scanned

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
